[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "floorscan"
version = "0.1.0"
description = "Phone-captured whole-property floor plan pipeline with calibrated confidence intervals"
requires-python = ">=3.10"
dependencies = [
    # Core
    "typer[all]>=0.9",
    "pydantic>=2.0",
    # Numerics & geometry
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "open3d>=0.17",
    "trimesh>=3.20",
    "shapely>=2.0",
    "networkx>=3.0",
    # CV & image
    "opencv-python-headless>=4.8",
    "Pillow>=10.0",
    "pillow-heif>=0.13",
    "exifread>=3.0",
    # Video
    "av>=10.0",
    # Rendering
    "matplotlib>=3.7",
    "svgwrite>=1.4",
    # ML (lightweight choices for 4GB VRAM)
    "torch>=2.0",
    "torchvision>=0.15",
    "transformers>=4.35",
    # SfM
    # "pycolmap>=0.6",  # install separately if available
    # Utilities
    "tqdm>=4.65",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[project.scripts]
floorscan = "floorscan.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
